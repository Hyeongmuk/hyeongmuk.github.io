name: Verify Astro pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/verify-site-source.mjs
      - run: npm run build
      - run: node scripts/verify-built-site.mjs
